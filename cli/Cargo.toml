[package]
name = "publicworks-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Local maintenance and persistence demo for Public Works"

[[bin]]
name = "publicworks"
path = "src/main.rs"

[dependencies]
