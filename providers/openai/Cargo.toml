[package]
name = "publicworks-provider-openai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/publicworks-provider-openai"
description = "OpenAI Responses adapter for Public Works agents"
keywords = ["openai", "llm", "agent", "responses-api", "rustls"]

[dependencies]
publicworks-agent = { version = "0.1.0", path = "../../agent" }
publicworks-runtime = { version = "0.1.0", path = "../../runtime" }
serde_json.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
futures-lite = "2"
