[package]
name = "publicworks-provider-openai"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
publicworks-agent = { path = "../../agent" }
publicworks-runtime = { path = "../../runtime" }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
futures-lite = "2"
