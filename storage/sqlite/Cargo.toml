[package]
name = "publicworks-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/publicworks-storage-sqlite"
description = "SQLite storage adapter for the Public Works runtime"
keywords = ["sqlite", "storage", "durable", "workflow", "persistence"]

[dependencies]
publicworks-runtime = { path = "../../runtime", version = "0.1.0" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json.workspace = true
serde = "1"

[dev-dependencies]
publicworks-runtime = { version = "0.1.0", path = "../../runtime", features = ["test-support"] }
futures-lite = "2"
