name: Checks

on:
  workflow_call:
  pull_request:
  push:
    # Main is verified through Release's call to this workflow, not a second run.
    branches-ignore:
      - main
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel verification belonging to a main-branch release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  msrv:
    name: Check MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.88.0

      - name: Cache Rust dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-msrv-${{ runner.os }}-

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --all-features --locked --offline

      - name: Test unified JSON features
        run: cargo test --workspace --all-features --locked --offline --features serde_json/arbitrary_precision

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings

      - name: Lint unified JSON features
        run: cargo clippy --workspace --all-targets --all-features --locked --offline --features serde_json/arbitrary_precision -- -D warnings

      - name: Build rustdoc
        run: env RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked --offline

      - name: Run local examples
        run: |
          cargo run -p publicworks-runtime --example task_abort --locked --offline
          cargo run -p publicworks-runtime --example task_execution --locked --offline
          cargo run -p publicworks-runtime --example task_memo --locked --offline
          cargo run -p publicworks-runtime --example task_tree --locked --offline
          cargo run -p publicworks-agent --example agent_turn --locked --offline
          cargo run -p publicworks-agent --example tool_policy --locked --offline

      - name: Verify packages
        run: cargo package --workspace --locked --offline
