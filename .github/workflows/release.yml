name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Publishing must finish before the next main-branch release starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release inputs
    uses: ./.github/workflows/checks.yml

  release:
    name: Publish crates and GitHub releases
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Publish with release-plz
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Update release PR
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_PR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Create or update release PR
        id: release-pr
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5.140
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Explicit dispatch bypasses GITHUB_TOKEN's normal recursion protection.
      # Checks run read-only on the PR branch, never in this write-enabled job.
      - name: Dispatch checks for the release PR
        if: steps.release-pr.outputs.pr != '' && steps.release-pr.outputs.pr != 'null'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          branch=$(jq -er '.head_branch | select(startswith("release-plz-"))' <<< "$RELEASE_PR")
          gh workflow run checks.yml --ref "$branch"
