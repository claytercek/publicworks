[workspace]
members = ["runtime", "storage/sqlite", "cli", "agent", "providers/openai", "perf"]
default-members = ["runtime", "storage/sqlite", "cli", "agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
