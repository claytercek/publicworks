[package]
name = "publicworks-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/publicworks-agent"
description = "Provider-neutral durable agent turns and extension hooks"
keywords = ["ai", "agent", "llm", "tools", "durable"]

[dependencies]
publicworks-runtime = { version = "0.1.0", path = "../runtime" }
serde_json.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[[example]]
name = "tool_policy"
test = true

[dev-dependencies]
futures-lite = "2"
publicworks-runtime = { version = "0.1.0", path = "../runtime", features = ["test-support"] }
publicworks-storage-sqlite = { version = "0.1.0", path = "../storage/sqlite" }
