[package]
name = "publicworks-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
publicworks-runtime = { path = "../runtime" }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
futures-lite = "2"
publicworks-storage-sqlite = { path = "../storage/sqlite" }
